<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <p class="eyebrow">GITHUB ACTIONS DEMO</p>
    <h1>Task Tracker</h1>
    <p class="subtitle">A tiny project with automated tests and deployment.</p>
    <form id="task-form">
      <input id="task-input" type="text" placeholder="What do you need to do?" aria-label="New task" required>
      <button type="submit">Add task</button>
    </form>
    <ul id="task-list" aria-live="polite"></ul>
    <p id="empty-state">No tasks yet. Add your first task.</p>
    <footer>Built and deployed with GitHub Actions</footer>
  </main>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
